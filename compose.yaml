services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: taxrag
      POSTGRES_USER: taxrag
      POSTGRES_PASSWORD: taxrag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxrag -d taxrag"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
