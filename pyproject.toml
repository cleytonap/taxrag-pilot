[project]
name = "taxrag"
version = "0.1.0"
description = "Source-grounded Brazilian IRPF question answering"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.18,<2",
  "beautifulsoup4>=4.14,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "lxml>=5.3,<7",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
